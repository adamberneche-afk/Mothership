name: Ping CTO Hub
on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  call-central-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 0 * * 0" ]; then
            echo "mode=refactor" >> $GITHUB_OUTPUT
          else
            echo "mode=debug" >> $GITHUB_OUTPUT
          fi
      - name: Send Payload to Hub
        run: |
          curl -X POST https://test-hub.vercel.app/api/autonomous_agent \
          -H "Content-Type: application/json" \
          -d '{
            "owner": "${{ github.repository_owner }}",
            "repo": "${{ github.event.repository.name }}",
            "mode": "${{ steps.mode.outputs.mode }}"
          }'