name: Deploy to Google Apps Script

# Real CD for the Apps Script backend: push to main -> production
# (GAS_PROD_DEPLOYMENT_ID), an existing Apps Script deployment created once
# by hand via the IDE (see README's "Alternative: Deploy Without Vercel"
# section) - `clasp deploy -i <id>` updates that deployment's code in place
# rather than minting a new one, which keeps its Web App URL stable.
#
# MAIN ONLY (2026-10-31). This used to deploy every pull request to a
# staging deployment. That was unsafe once the hub runs time-driven
# triggers (gas/spoke_poller.js): staging and production are deployments of
# ONE Apps Script project, and a trigger always runs the project's latest
# pushed code, not a deployment's pinned version - so a PR's `clasp push`
# would have run unmerged code in production on the next poll. A staging
# that needs isolation needs its own script project.
#
# After the deploy, the hub installs its own triggers
# (scripts/install-hub-triggers.mjs -> doPost ?endpoint=install-triggers),
# so nobody has to open the editor. That step needs ADMIN_SETTINGS_TOKEN as
# a repository secret, matching the hub's Script Property of the same name,
# and skips cleanly without it.
#
# NOT live-verified end-to-end: no Google account/clasp credential is
# reachable from this environment. clasp's own OAuth credential file has
# moved location across versions (~/.clasprc.json in older releases,
# ~/.config/clasp/.clasprc.json from clasp 2.4+) - this workflow writes the
# decoded CLASPRC_JSON secret to both paths to hedge against that, but
# which one a real `clasp push`/`clasp deploy` actually reads has never
# been confirmed from this session. Flagged honestly.
#
# Degrades to a clean, honest skip - not a red failure - until an operator
# has actually provisioned the real infrastructure this depends on (the
# Apps Script project, its two deployments, CLASPRC_JSON/GAS_SCRIPT_ID as
# repository secrets): the first step checks for CLASPRC_JSON/GAS_SCRIPT_ID
# and every later step is gated on that, rather than letting `clasp push`
# fail against an empty/missing credential. Otherwise this workflow would
# be permanently red on every single push/PR to this repo today, which
# reflects nothing about whether the code change itself is good.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One global group: `clasp push` always targets the ONE shared Apps Script
# project, so two deploys must never overlap. Newest cancels oldest.
concurrency:
  group: deploy-apps-script
  cancel-in-progress: true

jobs:
  deploy:
    # A manual dispatch from another branch must not push unmerged code
    # into the shared project either.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # This CD pipeline needs real, operator-provisioned infrastructure
      # (a live Apps Script project, two existing deployments, a clasp
      # OAuth credential) that a fresh clone of this repo does not have -
      # see README's "Alternative: Deploy Without Vercel" setup steps.
      # Every step below is gated on this rather than letting `clasp push`
      # fail on a missing/empty credential: until an operator has done that
      # one-time setup and added the secrets, this job should report a
      # clean, honest skip on every push/PR, not a perpetual red X that
      # never reflects anything about the actual code change.
      - name: Check required secrets are configured
        id: configured
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          if [ -n "$CLASPRC_JSON" ] && [ -n "$GAS_SCRIPT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLASPRC_JSON and/or GAS_SCRIPT_ID are not configured yet - skipping the actual deploy. See README's Apps Script setup steps."
          fi

      - uses: actions/setup-node@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: '20'

      - name: Install clasp
        if: steps.configured.outputs.ready == 'true'
        run: npm install --global @google/clasp@latest

      - name: Restore clasp credentials
        if: steps.configured.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          mkdir -p "$HOME/.config/clasp"
          echo "$CLASPRC_JSON" | base64 -d > "$HOME/.clasprc.json"
          echo "$CLASPRC_JSON" | base64 -d > "$HOME/.config/clasp/.clasprc.json"

      - name: Write .clasp.json for this run
        if: steps.configured.outputs.ready == 'true'
        env:
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          cat > gas/.clasp.json <<CLASPJSON
          { "scriptId": "$GAS_SCRIPT_ID", "rootDir": "." }
          CLASPJSON

      - name: Push source to the Apps Script project
        if: steps.configured.outputs.ready == 'true'
        working-directory: gas
        run: clasp push --force

      - name: Update the target deployment in place
        if: steps.configured.outputs.ready == 'true'
        working-directory: gas
        env:
          GAS_PROD_DEPLOYMENT_ID: ${{ secrets.GAS_PROD_DEPLOYMENT_ID }}
        run: clasp deploy -i "$GAS_PROD_DEPLOYMENT_ID" -d "Deployed from ${{ github.sha }}"

      - name: Smoke test the deployment
        if: steps.configured.outputs.ready == 'true'
        # No expected-commit check here - Apps Script's health response has
        # no commit field to compare against (see gas/Code.js's
        # renderHealthResponse comment), and scripts/smoke-test.js already
        # treats that as a real, disclosed platform difference rather than
        # a mismatch.
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
        run: node scripts/smoke-test.js "$GAS_WEB_APP_URL?endpoint=health"

      - name: Install the hub's triggers
        if: steps.configured.outputs.ready == 'true'
        env:
          ADMIN_SETTINGS_TOKEN: ${{ secrets.ADMIN_SETTINGS_TOKEN }}
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
        run: |
          if [ -z "$ADMIN_SETTINGS_TOKEN" ]; then
            echo "::notice::ADMIN_SETTINGS_TOKEN is not a repository secret - skipping trigger install. Run installSpokePollerTriggers() etc. from the editor instead, or add the secret."
            exit 0
          fi
          node scripts/install-hub-triggers.mjs "$GAS_WEB_APP_URL"
