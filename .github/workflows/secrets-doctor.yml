name: Secrets Doctor

# Floor check 10 (see CICD_FLOOR.md). Confirms every secret this repo's
# workflows actually reference is configured and non-empty, so an unset
# credential is found on purpose rather than by a scheduled job failing
# quietly for months. See scripts/secrets-doctor.mjs's header for the two
# incidents that motivated it.
#
# DISPATCH-ONLY, NEVER SCHEDULED. Both motivating incidents were scheduled
# jobs failing with nobody watching; adding another scheduled job is the
# last thing this should be.
#
# THE ENV BLOCK BELOW IS GENERATED. Do not edit it by hand:
#
#   node scripts/secrets-doctor.mjs --sync     rewrite it from the workflows
#   node scripts/secrets-doctor.mjs --check    fail if it has fallen behind
#
# --check runs on every pull request through the test suite, so adding a
# workflow that needs a new secret turns a PR red until this is regenerated.
#
# WHY GENERATED STATIC REFERENCES RATHER THAN A DERIVED LOOKUP. Two earlier
# revisions were flagged by CodeQL's js/excessive-secrets-exposure rule, and
# both times it was right:
#
#   1. Passing the whole secrets context as JSON and reducing it to names
#      with jq hands every value to the runner.
#   2. A matrix over the derived names with a DYNAMIC index looked airtight
#      and was not: the Actions service cannot know before dispatch which
#      secret such a job will read, so it ships the job every secret it
#      might need. Only a boolean reached the step, but the values were in
#      the job payload.
#
# A static `${{ secrets.NAME != '' }}` is resolvable before dispatch, so the
# job receives that secret and nothing else - the pattern doctor.yml has
# always used and that CodeQL has never flagged there. The comparison still
# happens inside the expression, so what lands in the environment is the
# string "true" or "false" rather than a credential.
#
# That puts the list back in this file, but nothing human maintains it, and
# a stale block fails CI rather than being discovered never. That was the
# real objection to the hand-written version in a sibling repo, whose doctor
# still checks three secrets while its workflows reference six.

on:
  workflow_dispatch:

jobs:
  secrets-doctor:
    runs-on: ubuntu-latest
    # Reads this repo's own files, plus one boolean per referenced secret.
    # No GitHub API calls and no writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Guards against this file having fallen behind the workflows it is
      # meant to cover. Belt and braces with the pull-request check: a
      # dispatch should never quietly skip a secret.
      - name: Verify the generated block still matches the workflows
        run: node scripts/secrets-doctor.mjs --check

      # No `npm ci` - scripts/secrets-doctor.mjs imports only node builtins,
      # on purpose, so this check cannot be taken down by a dependency
      # install failing.
      - name: Check every secret the workflows reference is configured
        env:
          # >>> generated by scripts/secrets-doctor.mjs --sync - do not edit by hand
          CONFIGURED_AI_API_KEY: ${{ secrets.AI_API_KEY != '' }}
          CONFIGURED_AI_BASE_URL: ${{ secrets.AI_BASE_URL != '' }}
          CONFIGURED_APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL != '' }}
          CONFIGURED_CLASPRC_JSON: ${{ secrets.CLASPRC_JSON != '' }}
          CONFIGURED_GAS_PROD_DEPLOYMENT_ID: ${{ secrets.GAS_PROD_DEPLOYMENT_ID != '' }}
          CONFIGURED_GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID != '' }}
          CONFIGURED_GAS_STAGING_DEPLOYMENT_ID: ${{ secrets.GAS_STAGING_DEPLOYMENT_ID != '' }}
          CONFIGURED_GAS_STAGING_WEB_APP_URL: ${{ secrets.GAS_STAGING_WEB_APP_URL != '' }}
          CONFIGURED_GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL != '' }}
          CONFIGURED_GLOBAL_GITHUB_TOKEN: ${{ secrets.GLOBAL_GITHUB_TOKEN != '' }}
          CONFIGURED_TENANT_CALLER_KEY: ${{ secrets.TENANT_CALLER_KEY != '' }}
          # <<< end generated block
        run: node scripts/secrets-doctor.mjs
