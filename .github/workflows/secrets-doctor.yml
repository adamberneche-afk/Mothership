name: Secrets Doctor

# Floor check 10 (see CICD_FLOOR.md). Confirms every secret this repo's
# workflows actually reference is actually configured and non-empty, so an
# unset credential is found on purpose rather than by a scheduled job
# failing quietly for months. See scripts/secrets-doctor.mjs's header for
# the two incidents that motivated it, and for why the expected list is
# derived from the workflow files rather than written down anywhere.
#
# DISPATCH-ONLY, NEVER SCHEDULED. Both motivating incidents were scheduled
# jobs failing with nobody watching; adding another scheduled job is the
# last thing this should be. Run it when provisioning a repo, rotating a
# credential, or diagnosing a broken step.
#
# NO SECRET VALUE EVER REACHES A RUNNER HERE, AND THAT IS THE POINT.
#
# The obvious implementation passes the whole secrets context in, as JSON,
# and reduces it to names. This workflow did that in its first revision, and CodeQL's
# js/excessive-secrets-exposure rule flagged it on the PR that introduced
# it: every organization and repository secret VALUE handed to the runner,
# in order to learn a list of names.
#
# The rule was right, so the design changed. Now:
#
#   plan   has no access to the secrets context at all. It reads the
#          workflow files and emits the names to probe as a matrix.
#   probe  runs one leg per name, and the ONLY secret-derived input is
#          `${{ secrets[matrix.secret] != '' }}`. The comparison happens
#          inside the expression; what crosses into the runner is the
#          string "true" or "false".
#
# That is strictly better than the first version rather than a compromise
# with it - it also upgraded the check from "a secret with this name
# exists" to "and it is non-empty". The cost is that it can no longer list
# a configured secret no workflow references, which needed the enumeration
# that was the exposure. See the script header.
#
# The matrix always carries GITHUB_TOKEN as a control leg: Actions mints it
# every run, so if that leg reports missing then `secrets[matrix.secret]`
# indexing is broken and every other leg in the run is wrong for a
# mechanical reason. Without it, a broken mechanism would look exactly like
# a repo that had lost all its credentials at once.

on:
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    # Reads this repo's own workflow files and nothing else. Notably no
    # secrets context is referenced anywhere in this job.
    permissions:
      contents: read
    outputs:
      secrets: ${{ steps.plan.outputs.secrets }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # No `npm ci` - scripts/secrets-doctor.mjs imports only node builtins,
      # on purpose, so this check cannot be taken down by a dependency
      # install failing.
      - name: Derive the secrets to probe from the workflow files
        id: plan
        run: node scripts/secrets-doctor.mjs

  probe:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Every leg runs even after one fails: the whole point is a complete
      # list of what is missing, not the first thing that is.
      fail-fast: false
      matrix:
        secret: ${{ fromJSON(needs.plan.outputs.secrets) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Check ${{ matrix.secret }} is configured
        env:
          SECRET_NAME: ${{ matrix.secret }}
          # The only secret-derived value in this workflow, and it is a
          # boolean. `secrets[matrix.secret]` selects one secret by name and
          # `!= ''` collapses it to true/false inside the expression, so the
          # value is compared where it lives and never crosses into the
          # runner environment, the log, or this script's process.
          SECRET_CONFIGURED: ${{ secrets[matrix.secret] != '' }}
        run: node scripts/secrets-doctor.mjs --probe
