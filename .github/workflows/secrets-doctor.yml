name: Secrets Doctor

# Floor check 10 (see CICD_FLOOR.md). Confirms every secret this repo's
# workflows actually reference is actually configured, so an unset
# credential is found on purpose rather than by a scheduled job failing
# quietly for months. See scripts/secrets-doctor.mjs's header for the two
# incidents that motivated it and for why the expected list is derived from
# the workflow files rather than written down anywhere.
#
# DISPATCH-ONLY, NEVER SCHEDULED. Both motivating incidents were scheduled
# jobs failing with nobody watching; adding another scheduled job is the
# last thing this should be. Run it when provisioning a repo, rotating a
# credential, or diagnosing a broken step.
#
# WHY TWO STEPS. GitHub gives a repo no way to list its own secrets: the
# REST endpoint needs a PAT, and GITHUB_TOKEN has no permission scope that
# covers it - there is no `secrets:` key in a permissions block. The only
# thing a workflow can enumerate is the `secrets` context, via
# `toJSON(secrets)`, which carries VALUES.
#
# So the first step reduces it to names and nothing else: one `jq keys[]`,
# with the JSON arriving through `env:` rather than interpolated into
# `run:`, writing a names-only file. The script in the second step is
# handed NAMES. It cannot print a secret value because it never has one -
# that is the point of the split, and collapsing these into a single step
# that pipes the JSON into Node would work and would be strictly worse.
#
# Deliberately no `set -x` in that step: tracing would echo the value of
# $ALL_SECRETS into the log. Actions masks known secret values in output,
# but not relying on that is cheaper than relying on it.

on:
  workflow_dispatch:

jobs:
  secrets-doctor:
    runs-on: ubuntu-latest
    # No GitHub API calls and no writes - it reads this repo's own files and
    # its own secrets context. Nothing beyond reading contents is needed.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Reduce the secrets context to names only
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          printf '%s' "$ALL_SECRETS" | jq -r 'keys[]' > "$RUNNER_TEMP/available-secret-names.txt"
          # Count only. Printing the names themselves is unnecessary here -
          # the script's report names each one it checked, next to the
          # workflow that references it, which is the useful form.
          echo "Reduced the secrets context to $(wc -l < "$RUNNER_TEMP/available-secret-names.txt") name(s)."

      # No `npm ci` - scripts/secrets-doctor.mjs imports only node builtins,
      # on purpose, so this check cannot be taken down by a dependency
      # install failing.
      - name: Check every secret the workflows reference is configured
        env:
          AVAILABLE_SECRET_NAMES_FILE: ${{ runner.temp }}/available-secret-names.txt
        run: node scripts/secrets-doctor.mjs
