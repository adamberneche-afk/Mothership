name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Read-only checkout is all this needs. Every scripts/dev-test-*.mjs
    # harness runs against a fully mocked octokit/fetch (see their own
    # headers) - this job needs zero GitHub or AI credentials, so it's safe
    # to run even on a pull_request opened from a fork.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run local mock-harness test suite
        run: npm test

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Verify the installer scripts still compile
        run: python3 -m py_compile setup_hub.py setup_spoke.py

      - name: Verify setup_hub.py's generated files match the real repo files
        run: |
          set -e
          rm -rf /tmp/hub-scratch
          mkdir -p /tmp/hub-scratch
          (cd /tmp/hub-scratch && python3 "$GITHUB_WORKSPACE/setup_hub.py")

          # Normalizes trailing-newline differences only - setup_hub.py's
          # embedded string literals never end in a trailing newline, while
          # the real files do; that's an accepted, cosmetic difference, not
          # drift. Anything else is a real mismatch between what the
          # installer would generate today and what's actually checked in.
          norm() { printf '%s\n' "$(cat "$1")"; }

          drift=0
          for f in \
            api/autonomous_agent.js api/recursive_learning.js \
            scripts/prune-logs.js scripts/health-report.js scripts/collect-issue-feedback.js \
            scripts/doctor.js \
            .github/workflows/self-reflect.yml .github/workflows/prune-logs.yml \
            .github/workflows/health-report.yml .github/workflows/recursive-learning.yml \
            .github/workflows/collect-issue-feedback.yml .github/workflows/doctor.yml \
            package.json .gitignore; do
            if ! diff -u <(norm "$f") <(norm "/tmp/hub-scratch/$f") > /tmp/hub-scratch-diff.txt; then
              echo "::error::setup_hub.py's embedded copy of $f has drifted from the real file"
              cat /tmp/hub-scratch-diff.txt
              drift=1
            fi
          done

          # spokes.json, universal_lessons.md, and north_star_framework.md are
          # deliberately NOT checked above: setup_hub.py seeds those with
          # fresh-install defaults, not a mirror of this repo's own live,
          # accumulated state, so they're expected to diverge from this repo's
          # real copies - that's not drift, it's the installer doing its job.
          exit $drift

  docs-check:
    runs-on: ubuntu-latest
    # Only meaningful against a PR's own diff - the "did docs come along
    # with this new file" question doesn't apply to a push/workflow_dispatch
    # run, which has no base to diff against.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone - needed to diff
          # reliably against the PR's base sha below.
          fetch-depth: 0

      - name: Require README updates alongside new capability files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          if echo "$PR_TITLE $PR_BODY" | grep -qi '\[skip-docs-check\]'; then
            echo "Skip marker found - not requiring a README update for this PR."
            exit 0
          fi

          added_files=$(git diff --diff-filter=A --name-only "$BASE_SHA" "$HEAD_SHA")
          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          watched_new_files=$(echo "$added_files" | grep -E '^(api/|gas/|dashboard/|\.github/workflows/)' || true)

          if [ -z "$watched_new_files" ]; then
            echo "No new files under api/, gas/, dashboard/, or .github/workflows/ - nothing to check."
            exit 0
          fi

          if echo "$changed_files" | grep -qx 'README.md'; then
            echo "New capability file(s) added and README.md was updated in the same PR:"
            echo "$watched_new_files"
            exit 0
          fi

          echo "::error::This PR adds new file(s) under api/, gas/, dashboard/, or .github/workflows/ but never touches README.md:"
          echo "$watched_new_files"
          echo ""
          echo "Update README.md to describe what this adds, or add '[skip-docs-check]' to the PR title/description if this genuinely needs no documentation."
          exit 1
