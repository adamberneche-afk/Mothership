name: Watchdog

# Closes this project's own founding-incident gap — see scripts/watchdog.js's
# header comment. Runs after the week's other schedules have had a chance
# to fire at least once (health-report.yml's own Monday 06:00 UTC run), so
# a failure from this week is visible without much lag.
on:
  schedule:
    - cron: '0 7 * * 2'  # Weekly, Tuesday 07:00 UTC
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read # listing this repo's own workflow runs
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install actionlint
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Check every workflow file is valid and every scheduled workflow's last run succeeded
        # The built-in token, not GLOBAL_GITHUB_TOKEN: everything this job
        # reads and writes is in this repo. On the shared secret, the alarm
        # died with the jobs it watches - GLOBAL_GITHUB_TOKEN went bad and
        # this job failed on 401 every week from 2026-09-08 to 10-27
        # without raising anything.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$PWD:$PATH"
          node scripts/watchdog.js
