name: Planted Scheduled Job

# PLANTED VIOLATION - floor check 9 proof, removed before merge.
# A `schedule:` trigger is what puts its script in coverage-gaps' scope.
# This never actually runs: schedule triggers only fire on the default
# branch, and this file is deleted before this branch merges.

on:
  schedule:
    - cron: '0 7 * * *'

jobs:
  planted:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/planted-job.js
